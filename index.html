<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#064e3b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="PALASH Vani - AI-Assisted Multilingual MTB-MLE Primary Education Suite for Jharkhand (Ho, Mundari, Santhali)" />
    <!-- Strict 100% Offline Content Security Policy (No external scripts, styles, or CDNs) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob: file:; style-src 'self' 'unsafe-inline'; font-src 'self' data: file:; img-src 'self' data: blob: file:; media-src 'self' data: blob: file:; connect-src 'self' file:;" />
    <link rel="manifest" href="./manifest.json" />
    <title>पलाश वाणी | PALASH Vani - MTB-MLE Primary Suite</title>
  </head>
  <body class="bg-[#f4f9f6] text-slate-900 antialiased selection:bg-emerald-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Automatically purge stale caches from previous sessions
      if ('caches' in window) {
        caches.keys().then((keys) => {
          keys.forEach((key) => {
            if (key.includes('v1')) {
              console.log('Purging legacy cache:', key);
              caches.delete(key);
            }
          });
        });
      }
      // Register modern offline ServiceWorker ONLY on HTTP/HTTPS (graceful skip on Electron file://)
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then((reg) => {
            reg.update();
            console.log('PALASH Vani v2.0 ServiceWorker active:', reg.scope);
          }).catch((err) => {
            console.warn('ServiceWorker registration note:', err);
          });
        });
      }
    </script>
  </body>
</html>
