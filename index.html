<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#064e3b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="PALASH Vani - AI-Assisted Multilingual MTB-MLE Primary Education Suite for Jharkhand (Ho, Mundari, Santhali)" />
    <link rel="manifest" href="/manifest.json" />
    <title>पलाश वाणी | PALASH Vani - MTB-MLE Primary Suite</title>
    <!-- Embedded font fallbacks for Ol Chiki & Devanagari -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Ol+Chiki:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#f4f9f6] text-slate-900 antialiased selection:bg-emerald-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Automatically purge stale caches from previous sessions
      if ('caches' in window) {
        caches.keys().then((keys) => {
          keys.forEach((key) => {
            if (key.includes('v1')) {
              console.log('Purging legacy cache:', key);
              caches.delete(key);
            }
          });
        });
      }
      // Register modern offline ServiceWorker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
            console.log('PALASH Vani v2.0 ServiceWorker active:', reg.scope);
          });
        });
      }
    </script>
  </body>
</html>
